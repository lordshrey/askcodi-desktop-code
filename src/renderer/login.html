<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com;">
    <title>AskCodi - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* Dark theme (default) - aligned with askcodi.com brand */
      :root {
        --bg: #1a1d23;
        --text: #e5e5e5;
        --text-logo: #73cfa8;
        --text-muted: #a0a0a0;
        --border: #333333;
        --btn-shadow: 0 1px 2px rgba(0,0,0,0.3);
        --input-bg: #14161b;
        --error-bg: rgba(255,107,107,0.1);
        --error-border: rgba(255,107,107,0.2);
        --error-text: #ff6b6b;
      }

      /* Light theme */
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #ffffff;
          --text: #1a1d23;
          --text-logo: #4dae82;
          --text-muted: #555555;
          --border: #d4d4d4;
          --btn-shadow: 0 1px 2px rgba(0,0,0,0.1);
          --input-bg: #f5f5f7;
          --error-bg: rgba(220,38,38,0.05);
          --error-border: rgba(220,38,38,0.2);
          --error-text: #dc2626;
        }
      }

      body {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        -webkit-app-region: drag;
      }
      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
        width: 320px;
        -webkit-app-region: no-drag;
      }
      .logo {
        height: 72px;
        width: auto;
      }
      .logo .text-path {
        fill: var(--text-logo);
      }
      .login-btn {
        width: 100%;
        height: 36px;
        padding: 0 12px;
        background: #73cfa8;
        color: #0a0a0a;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
        transition: background-color 0.15s ease, transform 0.15s ease;
        box-shadow: var(--btn-shadow);
      }
      .login-btn:hover {
        background: #5ec298;
      }
      .login-btn:active {
        transform: scale(0.97);
      }
      .login-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .divider {
        display: flex;
        align-items: center;
        width: 100%;
        gap: 12px;
        color: var(--text-muted);
        font-size: 12px;
      }
      .divider::before,
      .divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: var(--border);
      }
      .api-key-section {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .api-key-label {
        font-size: 13px;
        color: var(--text-muted);
      }
      .api-key-row {
        display: flex;
        gap: 8px;
      }
      .api-key-input {
        flex: 1;
        height: 36px;
        padding: 0 10px;
        background: var(--input-bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 13px;
        font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
        outline: none;
        transition: border-color 0.15s ease;
      }
      .api-key-input:focus {
        border-color: #73cfa8;
      }
      .api-key-input::placeholder {
        color: var(--text-muted);
      }
      .connect-btn {
        height: 36px;
        padding: 0 14px;
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
        transition: background-color 0.15s ease, border-color 0.15s ease;
      }
      .connect-btn:hover {
        background: var(--input-bg);
        border-color: var(--text-muted);
      }
      .connect-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .error-msg {
        width: 100%;
        padding: 8px 12px;
        background: var(--error-bg);
        border: 1px solid var(--error-border);
        border-radius: 8px;
        color: var(--error-text);
        font-size: 12px;
        display: none;
      }
      .error-msg.visible {
        display: block;
      }
    </style>
  </head>
  <body>

      <button class="login-btn" id="loginBtn">Sign in</button>

      <div class="divider">or</div>

      <div class="api-key-section">
        <div class="api-key-label">Connect with API key</div>
        <div class="api-key-row">
          <input type="password" class="api-key-input" id="apiKeyInput" placeholder="Enter your API key..." />
          <button class="connect-btn" id="connectBtn" disabled>Connect</button>
        </div>
      </div>

      <div class="error-msg" id="errorMsg"></div>
    </div>
    <script>
      console.log('Login page loaded');
      console.log('window.desktopApi:', window.desktopApi);

      // Listen for auth success from main process (via deep link)
      if (window.desktopApi && window.desktopApi.onAuthSuccess) {
        window.desktopApi.onAuthSuccess(function(user) {
          console.log('[Login] Auth success received:', user?.email);
        });
      }

      var apiKeyInput = document.getElementById('apiKeyInput');
      var connectBtn = document.getElementById('connectBtn');
      var loginBtn = document.getElementById('loginBtn');
      var errorMsg = document.getElementById('errorMsg');

      function showError(msg) {
        errorMsg.textContent = msg;
        errorMsg.classList.add('visible');
      }

      function hideError() {
        errorMsg.classList.remove('visible');
      }

      function setLoading(loading) {
        connectBtn.disabled = loading || !apiKeyInput.value.trim();
        connectBtn.textContent = loading ? 'Connecting...' : 'Connect';
        loginBtn.disabled = loading;
        apiKeyInput.disabled = loading;
      }

      // Enable/disable connect button based on input
      apiKeyInput.addEventListener('input', function() {
        connectBtn.disabled = !apiKeyInput.value.trim();
        hideError();
      });

      // Submit on Enter
      apiKeyInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && apiKeyInput.value.trim()) {
          connectBtn.click();
        }
      });

      // Sign in via OAuth
      loginBtn.addEventListener('click', function() {
        console.log('Sign in clicked');
        hideError();
        if (window.desktopApi && window.desktopApi.startAuthFlow) {
          window.desktopApi.startAuthFlow();
        } else {
          showError('Desktop API not available. Please restart the app.');
        }
      });

      // Connect with API key
      connectBtn.addEventListener('click', async function() {
        var apiKey = apiKeyInput.value.trim();
        if (!apiKey) return;

        hideError();
        setLoading(true);

        try {
          if (!window.desktopApi || !window.desktopApi.askCodiValidateApiKey) {
            showError('Desktop API not available. Please restart the app.');
            setLoading(false);
            return;
          }

          var result = await window.desktopApi.askCodiValidateApiKey(apiKey);
          if (result.success) {
            // API key validated and stored - reload into main app
            await window.desktopApi.askCodiAuthComplete();
          } else {
            showError(result.error || 'Invalid API key');
            setLoading(false);
          }
        } catch (err) {
          showError(err.message || 'Failed to validate API key');
          setLoading(false);
        }
      });
    </script>
  </body>
</html>
